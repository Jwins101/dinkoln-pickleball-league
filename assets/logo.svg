<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AD112B"/>
      <stop offset="100%" stop-color="#FF4F17"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <circle cx="120" cy="120" r="118" fill="url(#ring)"/>
  <circle cx="120" cy="120" r="104" fill="#650030"/>

  <!-- Abe: hat + profile silhouette (facing right) -->
  <g fill="#FBF7F2">
    <!-- stovepipe hat -->
    <path d="M70 78
             C70 66 78 58 90 58
             L104 58
             C114 58 121 64 122 74
             L122 80
             L133 80
             C137 80 140 83 140 87
             C140 91 137 94 133 94
             L70 94
             Z"/>
    <!-- hat brim -->
    <rect x="64" y="92" width="80" height="7" rx="3.5"/>
    <!-- face + beard + neck + shoulders -->
    <path d="M77 99
             C77 99 75 112 79 121
             C81 126 80 131 76 135
             C84 140 84 147 80 152
             C90 158 96 163 96 172
             C96 180 92 186 92 186
             L165 186
             C168 160 156 146 142 140
             C150 134 152 125 148 117
             C155 113 158 105 154 99
             C150 93 141 92 135 96
             C130 90 121 88 114 91
             C107 86 96 87 90 93
             C84 91 79 94 77 99 Z"/>
    <!-- eye notch -->
    <path d="M118 113 L126 111 L126 116 L119 118 Z" fill="#650030"/>
  </g>

  <!-- arm + paddle -->
  <g>
    <!-- forearm -->
    <path d="M150 150 L182 122" stroke="#FBF7F2" stroke-width="12" stroke-linecap="round"/>
    <!-- paddle handle -->
    <rect x="176" y="112" width="9" height="26" rx="4" transform="rotate(-42 180 125)" fill="#3A3A3A"/>
    <!-- paddle face -->
    <ellipse cx="197" cy="96" rx="22" ry="27" transform="rotate(-42 197 96)" fill="#FF4F17" stroke="#FBF7F2" stroke-width="4"/>
    <!-- paddle holes -->
    <g fill="#650030" opacity="0.55">
      <circle cx="190" cy="86" r="2.1"/>
      <circle cx="199" cy="84" r="2.1"/>
      <circle cx="207" cy="88" r="2.1"/>
      <circle cx="186" cy="95" r="2.1"/>
      <circle cx="195" cy="94" r="2.1"/>
      <circle cx="204" cy="97" r="2.1"/>
      <circle cx="191" cy="104" r="2.1"/>
      <circle cx="200" cy="105" r="2.1"/>
    </g>
  </g>

  <!-- pickleball -->
  <g fill="#FBF7F2" stroke="#650030" stroke-width="1.5">
    <circle cx="150" cy="72" r="10"/>
  </g>
  <g fill="none" stroke="#650030" stroke-width="1.3" opacity="0.7">
    <circle cx="150" cy="66" r="1.4" fill="#650030" stroke="none"/>
    <circle cx="145" cy="71" r="1.4" fill="#650030" stroke="none"/>
    <circle cx="155" cy="71" r="1.4" fill="#650030" stroke="none"/>
    <circle cx="147" cy="77" r="1.4" fill="#650030" stroke="none"/>
    <circle cx="153" cy="77" r="1.4" fill="#650030" stroke="none"/>
  </g>
</svg>
